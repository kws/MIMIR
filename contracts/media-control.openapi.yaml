openapi: 3.0.3
info:
  title: MIMIR Media Bridge Control API
  version: 1.0.0
  description: |
    Versioned contract between Media Controller and Media Bridge.
    This control contract is for inbound call handling only.

    Semantic versioning requirements:
      - MAJOR: Breaking contract changes (field removals/renames/type changes, required-ness tightening, route deletions, enum value removals).
      - MINOR: Backward-compatible additions (new optional fields, new routes, additive enum values).
      - PATCH: Non-contract clarifications only (descriptions/examples/docs).

    Breaking changes are forbidden without a MAJOR version bump so alternate media implementations can be swapped safely.
  x-contract-stability: semver
  x-breaking-change-policy: "forbidden-without-major-bump"
servers:
  - url: http://media-bridge:8081
paths:
  /v1/media/sessions:
    post:
      summary: Create a media session for a call
      operationId: CreateMediaSession
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateMediaSessionRequest'
      responses:
        '201':
          description: Session created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MediaSession'
  /v1/media/{call_id}/start:
    post:
      summary: Start media for an existing call
      operationId: StartMedia
      parameters:
        - $ref: '#/components/parameters/CallId'
      responses:
        '200':
          description: Media started
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MediaSession'
  /v1/media/{call_id}/stop:
    post:
      summary: Stop media for an existing call
      operationId: StopMedia
      parameters:
        - $ref: '#/components/parameters/CallId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StopMediaRequest'
      responses:
        '200':
          description: Media stopped
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MediaSession'
  /v1/media/{call_id}/health:
    get:
      summary: Get media health metrics for a call
      operationId: GetMediaHealth
      parameters:
        - $ref: '#/components/parameters/CallId'
      responses:
        '200':
          description: Current health metrics
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MediaHealth'
  /v1/media/events:
    get:
      summary: Stream Media Bridge lifecycle events to controller (SSE)
      operationId: StreamMediaEvents
      parameters:
        - in: query
          name: call_id
          required: false
          schema:
            type: string
          description: Optional filter for one call ID
      responses:
        '200':
          description: Server-sent event stream
          content:
            text/event-stream:
              schema:
                type: string
components:
  parameters:
    CallId:
      in: path
      name: call_id
      required: true
      schema:
        type: string
      description: Unique call identifier shared between controller and Media Bridge
  schemas:
    Endpoint:
      type: object
      required: [ip, port]
      properties:
        ip:
          type: string
          example: 10.10.4.18
        port:
          type: integer
          minimum: 1
          maximum: 65535
          example: 22222
    AIProfile:
      type: object
      required: [model_name, voice, instructions, greeting, vad_mode]
      properties:
        model_name:
          type: string
        voice:
          type: string
        instructions:
          type: string
        greeting:
          type: string
        vad_mode:
          type: string
          example: server_vad
    MediaSettings:
      type: object
      properties:
        input_codec:
          type: string
          default: g711_ulaw
        output_codec:
          type: string
          default: g711_ulaw
        sample_rate_hz:
          type: integer
          default: 8000
    CreateMediaSessionRequest:
      type: object
      required: [call_id, direction, local_rtp, remote_rtp, ai_profile]
      properties:
        call_id:
          type: string
        direction:
          type: string
          enum: [inbound]
          description: Mandatory policy field; only inbound calls are eligible for media allocation.
        local_rtp:
          $ref: '#/components/schemas/Endpoint'
        remote_rtp:
          $ref: '#/components/schemas/Endpoint'
        ai_profile:
          $ref: '#/components/schemas/AIProfile'
        media_settings:
          $ref: '#/components/schemas/MediaSettings'
    StopMediaRequest:
      type: object
      required: [reason]
      properties:
        reason:
          type: string
    MediaSession:
      type: object
      required: [media_session_id, call_id, status]
      properties:
        media_session_id:
          type: string
        call_id:
          type: string
        status:
          type: string
          enum: [created, starting, active, stopping, ended, failed]
        reason:
          type: string
    MediaHealth:
      type: object
      required: [call_id, jitter_ms, packet_loss_percent, ws_latency_ms]
      properties:
        call_id:
          type: string
        jitter_ms:
          type: number
          format: float
          minimum: 0
        packet_loss_percent:
          type: number
          format: float
          minimum: 0
          maximum: 100
        ws_latency_ms:
          type: number
          format: float
          minimum: 0
    MediaBridgeEvent:
      type: object
      required: [event_id, topic, call_id, occurred_at]
      properties:
        event_id:
          type: string
        topic:
          $ref: '#/components/schemas/MediaEventTopic'
        call_id:
          type: string
        occurred_at:
          type: string
          format: date-time
        payload:
          type: object
          additionalProperties: true
    MediaEventTopic:
      type: string
      description: Event topics emitted from Media Bridge back to controller
      enum:
        - MEDIA_READY
        - FIRST_AUDIO_RECEIVED
        - MEDIA_ERROR
        - MEDIA_ENDED
