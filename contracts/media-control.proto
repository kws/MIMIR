syntax = "proto3";

package mimir.media.v1;

import "google/protobuf/struct.proto";
import "google/protobuf/timestamp.proto";

// Prototype controller contract aligned with the media bridge HTTP API.
// Scope notes:
// - Inbound media only.
// - Session lifecycle operations are keyed by session_id.
// - Event streaming is exposed as a single media lifecycle stream.

message CallParticipant {
  string caller = 1;
  string callee = 2;
  string called_extension = 3;
}

message RtpFlow {
  string local_address = 1;
  uint32 local_port = 2;
  string remote_address = 3;
  uint32 remote_port = 4;
}

message RemoteRtpEndpoint {
  string address = 1;
  uint32 port = 2;
}

message AIProfile {
  string voice = 1;
  string instructions = 2;
  string greeting = 3;
  string vad_mode = 4;
  string model_name = 5;
  string initialisation = 6;
}

message MediaSettings {
  string input_codec = 1;
  string output_codec = 2;
  uint32 sample_rate_hz = 3;
}

message CreateMediaSessionRequest {
  string call_id = 1;
  string direction = 2;
  CallParticipant participant = 3;
  AIProfile ai_profile = 4;
  MediaSettings media_settings = 5;
  RtpFlow rtp = 6;
  map<string, string> metadata = 7;
}

message StartMediaSessionRequest {
  string session_id = 1;
  string idempotency_key = 2;
  RemoteRtpEndpoint remote_rtp = 3;
}

message StopMediaSessionRequest {
  string session_id = 1;
  string reason = 2;
  string idempotency_key = 3;
}

message GetMediaSessionRequest {
  string session_id = 1;
}

message TelemetryPayload {
  string runtime = 1;
  double packet_loss_pct = 2;
  double jitter_ms = 3;
  uint32 ws_reconnects = 4;
  uint32 ws_errors = 5;
  double first_audio_latency_ms = 6;
}

message PostSessionTelemetryRequest {
  string session_id = 1;
  TelemetryPayload telemetry = 2;
}

message AcceptedResponse {
  string status = 1;
}

enum MediaStatus {
  MEDIA_STATUS_UNSPECIFIED = 0;
  MEDIA_STATUS_CREATED = 1;
  MEDIA_STATUS_ACTIVE = 2;
  MEDIA_STATUS_TERMINATED = 3;
}

message MediaSession {
  string session_id = 1;
  string bridge_session_id = 2;
  string call_id = 3;
  MediaStatus status = 4;
  string reason = 5;
  RtpFlow rtp = 6;
}

message MediaLifecycleEvent {
  string event_id = 1;
  string event_type = 2;
  string media_session_id = 3;
  string bridge_session_id = 4;
  string call_id = 5;
  google.protobuf.Timestamp occurred_at = 6;
  google.protobuf.Struct attributes = 7;
}

message MediaEventSubscription {
  repeated string session_id = 1;
  string call_id = 2;
}

service MediaControlService {
  rpc CreateMediaSession(CreateMediaSessionRequest) returns (MediaSession);
  rpc StartMediaSession(StartMediaSessionRequest) returns (MediaSession);
  rpc StopMediaSession(StopMediaSessionRequest) returns (MediaSession);
  rpc GetMediaSession(GetMediaSessionRequest) returns (MediaSession);
  rpc PostSessionTelemetry(PostSessionTelemetryRequest) returns (AcceptedResponse);
  rpc StreamMediaEvents(MediaEventSubscription) returns (stream MediaLifecycleEvent);
}
