global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules/*.yaml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets:
          - prometheus:9090

  - job_name: orchestrator
    metrics_path: /metrics
    static_configs:
      - targets:
          - orchestrator:8080
        labels:
          service: orchestrator

  - job_name: media-bridge
    metrics_path: /metrics
    static_configs:
      - targets:
          - media-bridge:8081
        labels:
          service: media-bridge

