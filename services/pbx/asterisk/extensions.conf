[general]
static=yes
writeprotect=no

[lab]
; PBX-only diagnostics to isolate the phone/media leg from the RTP bridge.
; Dial 998 to hear a canned Asterisk prompt only.
exten => 998,1,NoOp(Asterisk playback-only diagnostic)
 same => n,Answer()
 same => n,Playback(demo-echotest)
 same => n,Hangup()

; Dial 999 to hear a canned prompt and then your own audio echoed back.
exten => 999,1,Answer()
 same => n,Playback(demo-echotest)
 same => n,Echo()
 same => n,Hangup()

; Dial 997 for echo only, without a prompt in front.
exten => 997,1,NoOp(Asterisk echo-only diagnostic)
 same => n,Answer()
 same => n,Echo()
 same => n,Hangup()

; RTP verifier entry points.
; Dial 3001-3006 to enter the ARI verifier for the matching 2001-2006 scientist profile.
exten => 3001,1,NoOp(Entering MIMIR RTP verifier for 2001)
 same => n,Answer()
 same => n,Stasis(mimir-rtp-verifier,2001)
 same => n,Hangup()

exten => 3002,1,NoOp(Entering MIMIR RTP verifier for 2002)
 same => n,Answer()
 same => n,Stasis(mimir-rtp-verifier,2002)
 same => n,Hangup()

exten => 3003,1,NoOp(Entering MIMIR RTP verifier for 2003)
 same => n,Answer()
 same => n,Stasis(mimir-rtp-verifier,2003)
 same => n,Hangup()

exten => 3004,1,NoOp(Entering MIMIR RTP verifier for 2004)
 same => n,Answer()
 same => n,Stasis(mimir-rtp-verifier,2004)
 same => n,Hangup()

exten => 3005,1,NoOp(Entering MIMIR RTP verifier for 2005)
 same => n,Answer()
 same => n,Stasis(mimir-rtp-verifier,2005)
 same => n,Hangup()

exten => 3006,1,NoOp(Entering MIMIR RTP verifier for 2006)
 same => n,Answer()
 same => n,Stasis(mimir-rtp-verifier,2006)
 same => n,Hangup()

; Pre-configured scientist extensions
exten => 2001,1,NoOp(Dialing scientist Arthur C. Clarke)
 same => n,Dial(PJSIP/2001,30)
 same => n,Voicemail(2001@default,u)
 same => n,Hangup()

exten => 2002,1,NoOp(Dialing scientist Albert Einstein)
 same => n,Dial(PJSIP/2002,30)
 same => n,Voicemail(2002@default,u)
 same => n,Hangup()

exten => 2003,1,NoOp(Dialing scientist Erwin Schrodinger)
 same => n,Dial(PJSIP/2003,30)
 same => n,Voicemail(2003@default,u)
 same => n,Hangup()

exten => 2004,1,NoOp(Dialing scientist Marie Curie)
 same => n,Dial(PJSIP/2004,30)
 same => n,Voicemail(2004@default,u)
 same => n,Hangup()

exten => 2005,1,NoOp(Dialing scientist Niels Bohr)
 same => n,Dial(PJSIP/2005,30)
 same => n,Voicemail(2005@default,u)
 same => n,Hangup()

exten => 2006,1,NoOp(Dialing scientist Nikola Tesla)
 same => n,Dial(PJSIP/2006,30)
 same => n,Voicemail(2006@default,u)
 same => n,Hangup()

; Let any pre-configured account reach any other numeric extension directly
exten => _1XXX,1,NoOp(Internal dial to ${EXTEN})
 same => n,Dial(PJSIP/${EXTEN},30)
 same => n,Hangup()

exten => _2XXX,1,NoOp(Internal dial to ${EXTEN})
 same => n,Dial(PJSIP/${EXTEN},30)
 same => n,Hangup()
